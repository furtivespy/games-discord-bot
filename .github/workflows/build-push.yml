name: Build and Push Docker Image

# Container test build. Merges to master are built once, by release.yml, which
# tags semver + latest. A pull request gets an image only when it carries the
# `container-testing` label; it is tagged pr-<number> and the head short SHA,
# never `latest`, so it cannot be deployed by accident.
on:
  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: container-testing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # `labeled` fires for every label added; only the container-testing label
    # (or a new push while it is already on) should build. Fork PRs have no secrets.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'container-testing')
      && (github.event.action != 'labeled' || github.event.label.name == 'container-testing')
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_docker-build-push.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      git_sha: ${{ github.event.pull_request.head.sha }}
      extra_tag: pr-${{ github.event.pull_request.number }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
