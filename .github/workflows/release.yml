name: Release

permissions: write-all

on:
  pull_request:
    types: [closed]

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag
        id: tag
        uses: K-Phoen/semver-release-action@1a1fc63a95a12b4bb535b53ab0d861bce53ce89d # master 2023-03-11
        with:
          release_branch: master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/_docker-build-push.yml
    with:
      semver_tag: ${{ needs.release.outputs.tag }}
      # Build the exact commit that landed on master; it is written into the image as /app/GIT_SHA.
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      git_sha: ${{ github.event.pull_request.merge_commit_sha }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  # The host pulls `latest` about every 5 minutes. Wait until the running app
  # reports this merge (or a newer commit that contains it) at /health.
  verify-deploy:
    needs: [release, build-and-push]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Wait for the deployed version
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: node scripts/check-deployed-version.js
