name: Docker Build and Push (reusable)

on:
  workflow_call:
    inputs:
      semver_tag:
        description: "Semver tag (e.g. v1.2.3). When provided, pushes semver + latest. Otherwise pushes the commit short SHA (and extra_tag)."
        required: false
        type: string
        default: ""
      ref:
        description: "Commit to check out and build."
        required: true
        type: string
      git_sha:
        description: "Full commit SHA written into the image as /app/GIT_SHA (served by GET /health)."
        required: true
        type: string
      extra_tag:
        description: "Additional tag for non-semver builds (e.g. pr-123)."
        required: false
        type: string
        default: ""
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_TOKEN:
        required: true

env:
  REGISTRY: gitea.willsullivan.dev
  IMAGE_NAME: furtivespy/game-bot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Resolve image tags
        id: meta
        env:
          SEMVER_TAG: ${{ inputs.semver_tag }}
          EXTRA_TAG: ${{ inputs.extra_tag }}
          GIT_SHA: ${{ inputs.git_sha }}
        run: |
          if [[ -n "${SEMVER_TAG}" ]]; then
            {
              echo "tags<<EOF"
              echo "${REGISTRY}/${IMAGE_NAME}:${SEMVER_TAG}"
              echo "${REGISTRY}/${IMAGE_NAME}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "${REGISTRY}/${IMAGE_NAME}:${GIT_SHA::7}"
              if [[ -n "${EXTRA_TAG}" ]]; then
                echo "${REGISTRY}/${IMAGE_NAME}:${EXTRA_TAG}"
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHA=${{ inputs.git_sha }}
