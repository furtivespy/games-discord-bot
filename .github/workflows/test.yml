name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # canvas is a production dependency; install Ubuntu build libs so
      # `bun install` can compile it if no prebuild exists. Command tests stub
      # GameFormatter and preload a fake canvas so no test draws a table.
      - name: Install canvas native libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          bun install --frozen-lockfile

      - name: Run tests
        run: bun test
        env:
          # No Discord token. Each test also mkdtemps GAMEBOT_DATA_DIR; this
          # only keeps any accidental store open out of the repo checkout.
          GAMEBOT_DATA_DIR: ${{ runner.temp }}/gamebot-ci
