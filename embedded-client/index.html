<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Bot</title>
    <script>
      /*__GAMEBOT_EMBEDDED_CONFIG__*/
    </script>
  </head>
  <body>
    <main>
      <p id="greeting">Connecting…</p>
      <p id="origin" hidden></p>
      <section id="game-picker" hidden>
        <p id="games-status" hidden></p>
        <label id="game-select-label" for="game-select" hidden>Your games</label>
        <select id="game-select" hidden>
          <option value="">Select a game</option>
        </select>
        <p id="selected-channel" hidden></p>
        <p id="games-empty" hidden>You're not in any active games on this server.</p>
      </section>
      <p id="snapshot-status" hidden></p>
      <div id="table" hidden>
        <section class="zone" data-zone="hand">
          <h2>Hand</h2>
          <div class="cards" id="hand-cards"></div>
        </section>
        <section class="zone" data-zone="play-area">
          <h2>My play area</h2>
          <div class="cards" id="play-area-cards"></div>
        </section>
        <section class="zone" data-zone="board">
          <h2>Game board</h2>
          <div class="cards" id="board-cards"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
